<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="St Matt's Taitā">
  <!-- A pared-back take on the church's woven-cross logo. The logo's own
       hatching and grid texture turn to mush below about 64px, so the mark is
       rebuilt here from flat shapes: the weave is carried by the red arm
       passing behind the upright on the left and in front of it on the right.
       The crossbar sits above centre so the mark reads as a cross rather than
       a plus sign or a first-aid symbol. -->
  <circle cx="16" cy="16" r="15.25" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.5"/>
  <!-- Upright. -->
  <rect x="12" y="3" width="8" height="26" fill="#2b2b2b"/>
  <!-- Left arm passes behind the upright. -->
  <rect x="4" y="10" width="8" height="7" fill="#e0374f"/>
  <!-- Right arm is drawn last, so it passes in front. -->
  <rect x="12" y="10" width="16" height="7" fill="#e0374f"/>
</svg>
